name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake up HF Space
        run: |
          curl \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 60 \
            --fail \
            --show-error \
            --silent \
            "${{ secrets.HF_SPACE_URL }}/health"

      - name: Confirm response
        run: echo "HF Space /health ping succeeded."
