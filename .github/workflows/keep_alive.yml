name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check space stage before ping
        run: |
          STAGE=$(curl -s "https://huggingface.co/api/spaces/imman12431/tennis-backhand-detector" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['runtime']['stage'])")
          echo "Space stage before ping: $STAGE"

      - name: Wake up HF Space
        run: |
          curl \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 60 \
            --fail \
            --show-error \
            --silent \
            --write-out "\nResponse time: %{time_total}s\n" \
            "${{ secrets.HF_SPACE_URL }}/health"
